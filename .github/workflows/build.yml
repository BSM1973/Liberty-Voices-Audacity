name: Voices Audacity - development
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure macOS ARM64
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: DSP tests
        run: ctest --test-dir build -C Release --verbose --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Voices-Audacity-QC-${{ matrix.os }}-v0.6.0
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Voices-Audacity-${{ matrix.os }}-v0.6.0
          path: build/VoicesAudacity_artefacts/Release/**
          if-no-files-found: error
